name: CI

on:
  push:
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  quality:
    name: Kiểm tra Python ${{ matrix.python-version }}
    runs-on: ubuntu-latest
    timeout-minutes: 20
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.10", "3.11"]

    steps:
      - name: Checkout mã nguồn
        uses: actions/checkout@v4

      - name: Thiết lập Python
        uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
          cache: pip

      - name: Cài dependencies
        run: |
          python -m pip install --upgrade pip
          python -m pip install -r requirements.txt

      - name: Tạo lại corpus mẫu
        run: python scripts/download_data.py

      - name: Kiểm tra catalog
        run: python scripts/validate_catalog.py

      - name: Chạy Ruff lint
        run: python -m ruff check --no-cache src scripts tests

      - name: Kiểm tra format Ruff
        run: python -m ruff format --check src scripts tests

      - name: Chạy test
        run: python -m pytest -q

  container:
    name: Build và smoke test Docker
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - name: Checkout mã nguồn
        uses: actions/checkout@v4

      - name: Thiết lập Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Build image không push
        uses: docker/build-push-action@v6
        with:
          context: .
          load: true
          tags: local/vietnamese-policy-rag:${{ github.sha }}
          cache-from: type=gha
          cache-to: type=gha,mode=max

      - name: Smoke test endpoint health
        shell: bash
        run: |
          set -euo pipefail
          container_id="$(docker run -d -p 8000:8000 local/vietnamese-policy-rag:${GITHUB_SHA})"
          cleanup() {
            docker logs "$container_id" || true
            docker rm -f "$container_id" >/dev/null 2>&1 || true
          }
          trap cleanup EXIT
          for attempt in {1..30}; do
            if curl --fail --silent --show-error http://127.0.0.1:8000/health >/tmp/health.json; then
              python -c "import json; data=json.load(open('/tmp/health.json', encoding='utf-8')); assert data['status'] in {'ok', 'degraded'}"
              exit 0
            fi
            sleep 2
          done
          echo "Container không sẵn sàng sau 60 giây."
          exit 1
