name: CI

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  quality:
    name: Kiểm tra Python ${{ matrix.python-version }}
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.10", "3.11"]

    steps:
      - name: Checkout mã nguồn
        uses: actions/checkout@v4

      - name: Thiết lập Python
        uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
          cache: pip

      - name: Cài dependencies
        run: |
          python -m pip install --upgrade pip
          python -m pip install -r requirements.txt

      - name: Tạo lại corpus mẫu
        run: python scripts/download_data.py

      - name: Kiểm tra catalog
        run: python scripts/validate_catalog.py

      - name: Chạy Ruff lint
        run: python -m ruff check --no-cache src scripts tests

      - name: Kiểm tra format Ruff
        run: python -m ruff format --check src scripts tests

      - name: Chạy test
        run: python -m pytest -q
